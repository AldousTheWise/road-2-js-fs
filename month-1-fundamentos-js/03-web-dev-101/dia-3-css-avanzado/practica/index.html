<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Galería Animada con CSS GRID</title>
</head>

<body>
    <header>
        <h1>Galería de Imágenes</h1>
        <p class="subtitle">Explora nuestra colección con animaciones fluidas</p>
    </header>

    <main>
        <div id="controles" class="controles">
            <!-- Contenido generado desde JS -->
        </div>
        <div id="galeria" class="galeria">
            <!-- Contenido generado desde JS -->
        </div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-contenido">
            <button id="cerrar-modal" class="cerrar-modal">&times;</button>
            <img id="modal-imagen" class="modal-imagen" src="" alt="">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
