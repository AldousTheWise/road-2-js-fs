<h1>Crear Cuenta</h1>

<div class="auth-container">
    {{#if error}}
    <div class="alert alert-error">
        <strong>Error:</strong> {{error}}
    </div>
    {{/if}}

    <form class="auth-form" action="/register" method="POST">
        <div class="form-group">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required class="form-input" value="{{formData.nombre}}">
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required class="form-input" value="{{formData.email}}">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required class="form-input" minlength="6">
            <small class="form-hint">Mínimo 6 caracteres</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required class="form-input">
        </div>

        <div class="form-group">
            <button type="submit" class="btn-primary btn-block">
                Registrarse
            </button>
        </div>
    </form>

    <div class="auth-links">
        <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
        <p><a href="/">Volver al inicio</a></p>
    </div>
</div>
